<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening YouTube</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }
        .icon-box {
            background-color: #ff0000;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .play-triangle {
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid #ffffff;
        }
        h1 {
            font-size: 24px;
            letter-spacing: 2px;
            margin: 10px 0;
        }
        p {
            color: #666;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .fallback {
            margin-top: 30px;
            color: #888;
            font-size: 13px;
        }
        .fallback a {
            color: #ff3333;
            text-decoration: none;
            font-weight: bold;
        }

        /* Custom Popup Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background-color: #222222;
            width: 85%;
            max-width: 340px;
            border-radius: 4px;
            text-align: left;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            border-top: 3px solid #ff0000;
        }
        .modal-content {
            padding: 20px;
        }
        .modal-box h3 {
            margin: 0 0 12px 0;
            font-size: 17px;
            color: #ffffff;
            font-weight: 600;
        }
        .modal-box p {
            margin: 0 0 20px 0;
            font-size: 13px;
            color: #b0b0b0;
            text-transform: none;
            line-height: 1.4;
            text-align: left;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            padding: 0 20px 20px 20px;
        }
        .modal-buttons button {
            background: none;
            border: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 4px;
            letter-spacing: 0.5px;
        }
        .btn-goback {
            color: #b0b0b0;
        }
        .btn-continue {
            color: #ff4d4d;
        }
    </style>
</head>
<body>

    <div class="icon-box">
        <div class="play-triangle"></div>
    </div>

    <h1>OPENING YOUTUBE</h1>
    <p>Launching app instantly...</p>

    <div class="fallback">
        Not opening? <a href="#" id="fallback-link">Tap here</a>
    </div>

    <!-- Custom Popup Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-content">
                <h3>You're leaving our app</h3>
                <p>The website you're viewing is attempting to open an external app. Would you like to continue?</p>
            </div>
            <div class="modal-buttons">
                <button class="btn-goback" onclick="goBack()">GO BACK</button>
                <button class="btn-continue" onclick="openYouTube()">CONTINUE</button>
            </div>
        </div>
    </div>

    <script>
        // URL se parameters read karne ka logic
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v'); // e.g., ?v=XYZ123

        // Default link (agar koi ?v parameter na ho, toh channel khulega)
        let targetUrl = "https://youtube.com/@kumarbuildspro?si=a58Tjord4fyY3XRi&sub_confirmation=1";

        // Agar URL me video ID di gayi hai, toh target URL us video ka ban jayega
        if (videoId) {
            targetUrl = `https://www.youtube.com/watch?v=${videoId}`;
        }

        // Fallback link aur Global variable update karna
        window.onload = function() {
            document.getElementById('fallback-link').href = targetUrl;
            window.finalTargetUrl = targetUrl;
        };

        function openYouTube() {
            window.location.href = window.finalTargetUrl;
        }

        function goBack() {
            document.getElementById('customModal').style.display = 'none';
        }
    </script>

</body>
</html>
